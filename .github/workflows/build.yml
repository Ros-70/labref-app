name: LabRef — verify and build

# The ordering here is the whole point of this file.
#
# The clinical QA suite runs FIRST and is a hard gate. Nothing is packaged
# unless all four verification methods pass, so a data error can never reach an
# APK. For a clinical reference app that ordering matters more than build speed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — the clinical content itself. No Android toolchain involved, so
  # this fails fast and cheaply when something is wrong with the data.
  # ---------------------------------------------------------------------------
  clinical-qa:
    name: Clinical QA (4 methods)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright with Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Build the single-file app
        working-directory: app
        run: python3 -I build.py

      # Methods 1 and 4 launch a browser. The suite honours CHROME_PATH and
      # otherwise falls back to Playwright's bundled Chromium, which is what
      # happens here.
      - name: Run all four verification methods
        run: bash qa/run_all.sh

      - name: Upload the verified build
        uses: actions/upload-artifact@v4
        with:
          name: labref-html
          path: app/LabRef_v1.10.html
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Gate 2 — the Android host. Only reached if the clinical QA passed.
  # ---------------------------------------------------------------------------
  android-build:
    name: Android build
    needs: clinical-qa
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'       # must match jvmTarget in app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4

      # The Gradle `stageClinicalAsset` task copies this into assets and fails
      # the build if it is absent, so building it here is what makes the APK
      # contain clinical content at all.
      - name: Build the single-file app
        working-directory: app
        run: python3 -I build.py

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: labref-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Gate 3 — on-device smoke test. This is the only thing that proves the asset
  # loader serves the page, that localStorage works at the pinned origin, and
  # that the JS bridge survived R8. All three fail silently at runtime if wrong.
  #
  # The emulator is slow and occasionally flaky on hosted runners, so it does
  # not block a normal push; it runs on demand and on pull requests, where a
  # failure is worth waiting for.
  # ---------------------------------------------------------------------------
  instrumented-smoke:
    name: On-device smoke test
    needs: android-build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the single-file app
        working-directory: app
        run: python3 -I build.py

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-report
          path: android/app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Release AAB. Manual only, and signing material comes from repository
  # secrets — never from the repo. If the secrets are absent the job produces
  # an unsigned bundle rather than failing, so the build is still verifiable.
  # ---------------------------------------------------------------------------
  release-bundle:
    name: Release AAB
    needs: [clinical-qa, android-build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the single-file app
        working-directory: app
        run: python3 -I build.py

      - name: Decode keystore if one is configured
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing keystore configured — producing an unsigned bundle."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release bundle
        working-directory: android
        env:
          LABREF_KEYSTORE: ${{ runner.temp }}/release.jks
          LABREF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LABREF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LABREF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: labref-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: error
