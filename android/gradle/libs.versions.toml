# Single place where every version lives, so an autonomous build has one file to
# change and one place to look when a toolchain error appears.
#
# These are pinned on purpose. Do NOT replace a pin with a "+" or "latest"
# range: a floating dependency means a build that passed yesterday can fail
# today with no commit, which is the single worst failure mode for an
# unattended build.
#
# The versions below are mutually compatible. If you bump one, check the other
# three in the same commit: AGP <-> Gradle <-> Kotlin <-> compileSdk move
# together.

[versions]
agp = "8.5.2"
kotlin = "2.0.20"
coreKtx = "1.13.1"
appcompat = "1.7.0"
constraintlayout = "2.1.4"
activity = "1.9.2"
# androidx.webkit 1.6.0+ is required for setAlgorithmicDarkeningAllowed,
# which is what stops Android dark mode from inverting the app's own themes.
webkit = "1.11.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
androidxRunner = "1.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
