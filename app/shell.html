    <div class="kv"><span class="k">Version</span><span class="v">LabRef v${LABREF_VERSION} — prototype</span></div>
    <div class="kv"><span class="k">Records</span><span class="v">${TESTS.length} tests · ${TUBES.length} tube types · ${CATS.length} categories</span></div>
    <div class="kv"><span class="k">Connectivity</span><span class="v">Fully offline. No network access, no permissions, no data leaves this device.</span></div>
    <div class="alert warn" style="margin-top:12px"><b>For use by qualified clinicians.</b>
    Reference intervals depend on method, analyser and population. Always defer to the interval printed on your own
    laboratory's report, and to your hospital's own critical value policy. This app supports clinical judgement; it does not replace it.</div>
  </div>`;
  $$("[data-th]").forEach(b=> b.onclick=()=>{ S.theme=b.dataset.th; save(); applyTheme(); renderMore(); });
  $$("[data-un]").forEach(b=> b.onclick=()=>{ S.units=b.dataset.un; save(); renderMode(); renderMore(); });
  $("#fsRange").oninput = e=>{ S.fs=+e.target.value; save(); applyTheme();
    e.target.previousElementSibling.textContent = "Text size — "+S.fs+"%"; };
  $("#bkExp").onclick = ()=> download("labref-backup.json", JSON.stringify(Object.assign({type:"labref-backup",version:LABREF_VERSION},S),null,2));
  $("#bkImp").onclick = ()=> $("#bkFile").click();
  $("#bkFile").onchange = e=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      /* accept backups written by the pre-rename MedRef builds too */
      if(d.type!=="labref-backup" && d.type!=="medref-backup") throw 0;
      S=Object.assign(freshState(),d); normalizeState();
      save(); applyTheme(); renderMode(); render();
      say("Backup restored", "Your settings and saved lab values are back.");
    }catch(err){ say("Restore failed", "That file is not a LabRef backup."); } };
    r.readAsText(f); e.target.value="";
  };
  $("#bkReset").onclick = async ()=>{
    const ok = await ask("Reset LabRef?",
      "This erases your theme and text size, units, patient mode, favourites, "
      + "the test picker, and every lab value, method and note you have saved "
      + "under My Lab.\n\nThe app's own reference data is not affected. This "
      + "cannot be undone — use Backup everything first if you may want them back.",
      { okLabel:"Erase everything", danger:true });
    if(!ok) return;
    S = freshState();
    save();
    /* The user asked for an erase, so the pre-rename copy goes too. The
       passive migration path deliberately leaves medref_v1 in place, but
       leaving a full second copy of the values someone just chose to erase
       would make the button a lie — and a reload would migrate them back
       the moment labref_v1 were ever cleared. */
    try{ localStorage.removeItem(LS_LEGACY); }catch(e){}
    applyTheme(); renderMode(); render();
    await say("Reset complete", "Everything you had saved on this device has been erased.");
  };
}

function download(name,txt){
  const b=new Blob([txt],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------------------------------------------------------------- MODE BAR */
function renderMode(){
  const b = $$("#modebar .chip");
  b[0].textContent = "Units: " + (S.units==="si"?"SI":"Conventional"); b[0].classList.add("on");
  b[1].textContent = S.sex==="M"?"Male":"Female"; b[1].classList.toggle("on", true);
  const ages = {neonate:"Neonate",infant:"Infant",child:"Child",adolescent:"Adolescent",adult:"Adult"};
  b[2].textContent = ages[S.age]; b[2].classList.toggle("on", S.age!=="adult");
  const pg = {none:"Not pregnant",T1:"Pregnant T1",T2:"Pregnant T2",T3:"Pregnant T3"};
  b[3].textContent = pg[S.preg]; b[3].classList.toggle("on", S.preg!=="none");
  b[3].style.display = S.sex==="F" ? "" : "none";
}
$$("#modebar .chip").forEach(c=> c.onclick = ()=>{
  const m=c.dataset.mode;
  if(m==="units") S.units = S.units==="conv"?"si":"conv";
  if(m==="sex"){ S.sex = S.sex==="M"?"F":"M"; if(S.sex==="M") S.preg="none"; }
  if(m==="age"){ const o=["adult","neonate","infant","child","adolescent"];
    S.age = o[(o.indexOf(S.age)+1)%o.length]; if(S.age!=="adult") S.preg="none"; }
  if(m==="preg"){ const o=["none","T1","T2","T3"]; S.preg = o[(o.indexOf(S.preg)+1)%o.length];
    if(S.preg!=="none"){ S.sex="F"; S.age="adult"; } }
  save(); renderMode(); render();
});

/* ---------------------------------------------------------------- SEARCH BAR */
$("#searchToggle").onclick = ()=>{
  const w=$("#searchWrap");
  const show = w.style.display==="none";
  w.style.display = show?"block":"none";
  if(show){ navStack=[]; activeCat=null; go("tests"); $("#searchBox").focus(); }
  else { $("#searchBox").value=""; }
  render();
};
let st=null;
$("#searchBox").oninput = ()=>{ clearTimeout(st); st=setTimeout(()=>{ activeCat=null; renderTests(); },120); };

/* ---------------------------------------------------------------- THEME */
function applyTheme(){
  document.body.dataset.theme = S.theme;
  /* Scale the root element's real font-size (not a custom property) so every
     rem-sized element in the app — headings, rows, badges, buttons, not just
     inputs — resizes together. */
  document.documentElement.style.fontSize = S.fs + "%";
  const tc = {light:"#0f766e",dark:"#161e26",sepia:"#8a6d3b",pista:"#577a30",beige:"#7c6a42",steel:"#3f5b68"}[S.theme];
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = tc;
}

/* ---------------------------------------------------------------- BOOT */
function render(){
  if(current==="tests")  renderTests();
  if(current==="tools")  renderTools();
  if(current==="tubes")  renderTubes();
  if(current==="mylab")  renderMyLab();
  if(current==="more")   renderMore();
  if(current==="detail") renderDetail();
}
/* version label in the app bar, written from the data module so the number
   has exactly one source of truth (LABREF_VERSION) */
(()=>{ const v = $("#appVer"); if(v) v.textContent = "v " + LABREF_VERSION; })();

/* in-app dialog wiring: OK confirms, Cancel and Escape and a tap on the
   backdrop all cancel. A cancelled confirm must resolve false, never hang. */
$("#dlgOk").onclick = ()=> closeDlg(true);
$("#dlgCancel").onclick = ()=> closeDlg(false);
$("#dlgWrap").onclick = e=>{ if(e.target === $("#dlgWrap")) closeDlg(false); };
document.addEventListener("keydown", e=>{
  if(!$("#dlgWrap").classList.contains("on")) return;
  if(e.key === "Escape"){ e.preventDefault(); closeDlg(false); }
  if(e.key === "Enter"){ e.preventDefault(); closeDlg(true); }
});

applyTheme(); renderMode(); go("tests"); render();

})();
</script>
</body>
</html>
