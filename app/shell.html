<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LabRef — Laboratory Test Reference</title>
<style>
/* ===================== THEME TOKENS ===================== */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface2:#eef2f5; --border:#d8e0e6;
  --text:#16212b; --text2:#5b6b78; --text3:#8b9aa6;
  --accent:#0f766e; --accent-soft:#d7eeea; --accent-text:#0b5952;
  --danger:#c62828; --danger-soft:#fdeaea;
  --warn:#b45309; --warn-soft:#fdf3e3;
  --ok:#2e7d32; --ok-soft:#e6f4e7;
  --local:#6d28d9; --local-soft:#ede8fb;
  --shadow:0 1px 3px rgba(16,32,45,.09),0 1px 2px rgba(16,32,45,.05);
  --radius:12px;
}
/* Text size is applied to the root element's real font-size (see applyTheme()
   in the script), not as a custom property — every rem unit in this file
   measures against the root, so that single change scales the whole app. */
html{-webkit-text-size-adjust:100%}
[data-theme="dark"]{
  --bg:#0e1419; --surface:#161e26; --surface2:#1d2831; --border:#2a3742;
  --text:#e4ecf2; --text2:#9fb0bd; --text3:#6f8291;
  --accent:#2dd4bf; --accent-soft:#14312e; --accent-text:#5eead4;
  --danger:#f87171; --danger-soft:#3a1a1a;
  --warn:#fbbf24; --warn-soft:#3a2d12;
  --ok:#4ade80; --ok-soft:#14301c;
  --local:#a78bfa; --local-soft:#241a3d;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
[data-theme="sepia"]{
  --bg:#f4ecd8; --surface:#fdf6e3; --surface2:#efe4ca; --border:#ddcdaa;
  --text:#3b2f1e; --text2:#6b5a42; --text3:#917f63;
  --accent:#8a6d3b; --accent-soft:#eadfc4; --accent-text:#6b5325;
  --danger:#9b2c2c; --danger-soft:#f3dede;
  --warn:#8a5a10; --warn-soft:#f0e3c8;
  --ok:#4a6b2f; --ok-soft:#e3ecd6;
  --local:#6b4f8a; --local-soft:#e8e0f0;
  --shadow:0 1px 3px rgba(80,60,30,.15);
}
[data-theme="pista"]{
  --bg:#eef3e3; --surface:#fbfdf7; --surface2:#e4ecd5; --border:#cddab0;
  --text:#28361f; --text2:#5c6e49; --text3:#8a9975;
  --accent:#577a30; --accent-soft:#e1ecd0; --accent-text:#3c5620;
  --danger:#b5342f; --danger-soft:#f6e2df;
  --warn:#9c6414; --warn-soft:#f1e3c4;
  --ok:#2e7d32; --ok-soft:#e1efdc;
  --local:#6d4f9e; --local-soft:#e9e1f4;
  --shadow:0 1px 3px rgba(50,70,30,.12);
}
[data-theme="beige"]{
  --bg:#f1e9d6; --surface:#fbf7ec; --surface2:#e7dcc0; --border:#dccda5;
  --text:#382f1f; --text2:#6b5e45; --text3:#988968;
  --accent:#7c6a42; --accent-soft:#ecdfc1; --accent-text:#59492a;
  --danger:#ad3f36; --danger-soft:#f3e0da;
  --warn:#946319; --warn-soft:#eedfbd;
  --ok:#53713a; --ok-soft:#e4ecd7;
  --local:#6c5690; --local-soft:#e8e1f1;
  --shadow:0 1px 3px rgba(70,55,30,.13);
}
[data-theme="steel"]{
  --bg:#e7ebee; --surface:#f8fafb; --surface2:#dde3e8; --border:#c3ccd3;
  --text:#232d33; --text2:#55636c; --text3:#84929a;
  --accent:#3f5b68; --accent-soft:#dbe6ea; --accent-text:#2c4149;
  --danger:#bc3a34; --danger-soft:#f4e0de;
  --warn:#a1650f; --warn-soft:#f0e2c9;
  --ok:#33754a; --ok-soft:#dfeee3;
  --local:#5a4d9e; --local-soft:#e4e0f3;
  --shadow:0 1px 3px rgba(30,45,55,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem; line-height:1.5;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent-text)}

/* ===================== APP BAR ===================== */
#appbar{
  position:sticky;top:0;z-index:50;background:var(--accent);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
  box-shadow:var(--shadow);
}
#appbar .bar-row{display:flex;align-items:center;gap:10px}
[data-theme="dark"] #appbar,[data-theme="sepia"] #appbar{color:#06211e}
[data-theme="sepia"] #appbar{color:#fff}
#appbar .title{font-weight:650;font-size:1.05rem;flex:1;letter-spacing:-.01em;min-width:0}
/* version sits beside the app name, deliberately quieter than it */
#appbar .ver{font-size:.68rem;font-weight:500;opacity:.75;margin-left:6px;
  letter-spacing:0;white-space:nowrap}
/* Breadcrumb "page address". Laid out as a flex row so that when the trail is
   too wide for a phone, the ancestor crumbs ellipsise first and the current
   page name — the part that matters most — keeps its space. */
#appbar .sub{font-size:.7rem;font-weight:400;letter-spacing:.02em;
  display:flex;align-items:baseline;gap:4px;overflow:hidden;margin-top:1px}
/* Shrink priority when the trail is too wide: the root crumb is always one
   short word and never shrinks; the middle (category) crumb absorbs almost
   all of the overflow; the current page name gives up space last. */
#appbar .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:0 1 auto;min-width:0;padding:2px 0}
#appbar .crumb.root{flex:0 0 auto}
#appbar .crumb.mid{flex:0 100 auto;min-width:2.5em}
#appbar .crumb.link{text-decoration:underline;text-underline-offset:2px}
#appbar .crumb.link:active{opacity:.7}
#appbar .crumb.now{flex:1 1 auto;max-width:none;font-weight:650;
  color:var(--crumb-now);text-decoration:none}
#appbar .csep{flex:none;opacity:.6}
/* Current-page colour, tuned per theme. The app bar is the theme's accent
   colour, so one global highlight cannot clear 4.5:1 (WCAG AA for text this
   small) on all six — sepia's mid-brown accent tops out at 4.85:1 even
   against pure white. Each value below is the most saturated warm tone that
   still clears 4.5:1 on that theme's own bar; the default covers any theme
   added later. */
#appbar{--crumb-now:#fff4d1}
[data-theme="light"] #appbar{--crumb-now:#ffe8a3}
[data-theme="sepia"] #appbar{--crumb-now:#fff7de}
[data-theme="pista"] #appbar{--crumb-now:#fff4d1}
[data-theme="beige"] #appbar{--crumb-now:#ffedb5}
[data-theme="steel"] #appbar{--crumb-now:#ffd966}
[data-theme="dark"]  #appbar{--crumb-now:#6b1f0a}
.iconbtn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  font-size:1.15rem;color:inherit;flex:none;
}
.iconbtn:active{background:rgba(255,255,255,.18)}
#backBtn{display:none}

/* ===================== SEARCH ===================== */
#searchWrap{padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
#searchBox{
  width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);outline:none;
}
#searchBox:focus{border-color:var(--accent)}

/* ===================== PATIENT MODE BAR ===================== */
#modebar{
  display:flex;gap:6px;padding:8px 12px;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;
}
#modebar::-webkit-scrollbar{display:none}
.chip{
  padding:5px 11px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface2);font-size:.8rem;white-space:nowrap;color:var(--text2);
}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:600}

/* ===================== LAYOUT ===================== */
main{padding:12px;max-width:760px;margin:0 auto}
.view{display:none}
.view.active{display:block}
h2.sec{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);
  margin:18px 0 8px;font-weight:700}
h2.sec:first-child{margin-top:4px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}
.card-pad{padding:14px}

/* list rows */
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);
  background:var(--surface);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface2)}
.row .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  font-size:1.1rem;flex:none;color:#fff}
.row .bd,.picker-item .bd{flex:1;min-width:0}
.nm{display:block;font-weight:600;font-size:.95rem;line-height:1.3}
.ds{display:block;font-size:.78rem;color:var(--text2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ch{color:var(--text3);font-size:1.1rem;flex:none}
.row .dot{width:7px;height:7px;border-radius:50%;background:var(--local);flex:none}

/* badges */
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.68rem;
  font-weight:700;letter-spacing:.03em;text-transform:uppercase;vertical-align:middle}
.b-assay{background:var(--warn-soft);color:var(--warn)}
.b-crit{background:var(--danger-soft);color:var(--danger)}
.b-local{background:var(--local-soft);color:var(--local)}
.b-fast{background:var(--accent-soft);color:var(--accent-text)}

/* ===================== TEST DETAIL ===================== */
.detail-head{padding:16px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.detail-head h1{margin:0;font-size:1.3rem;line-height:1.25;letter-spacing:-.015em}
.detail-head .abbr{color:var(--text2);font-size:.88rem;margin-top:3px}
.detail-head .badges{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}

.block{margin-bottom:10px}
.block > .bh{display:flex;align-items:center;gap:8px;padding:12px 14px;
  font-weight:650;font-size:.9rem;background:var(--surface);width:100%;text-align:left;
  border-bottom:1px solid transparent}
.block.open > .bh{border-bottom-color:var(--border)}
.block > .bh .tw{margin-left:auto;color:var(--text3);transition:transform .18s;font-size:.85rem}
.block.open > .bh .tw{transform:rotate(90deg)}
.block > .bc{display:none;padding:12px 14px;background:var(--surface)}
.block.open > .bc{display:block}
/* a block whose body is a flush list of .row buttons — the rows carry their
   own padding and must reach the card edges, so the body adds none */
.block > .bc.flush{padding:0}

ul.lst{margin:0;padding-left:18px}
ul.lst li{margin-bottom:6px;font-size:.9rem;line-height:1.5}
ul.lst li:last-child{margin-bottom:0}

/* range table */
table.rng{width:100%;border-collapse:collapse;font-size:.86rem}
table.rng th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text3);padding:6px 8px;border-bottom:1px solid var(--border);font-weight:700}
table.rng td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
table.rng tr:last-child td{border-bottom:none}
table.rng tr.match td{background:var(--accent-soft)}
table.rng tr.localrow td{background:var(--local-soft)}
.rng-sub + .rng-sub{margin-top:18px;padding-top:14px;border-top:1px dashed var(--border)}
.rng-sub .comp-h{font-weight:700;font-size:.85rem;margin-bottom:6px}
.mylab-comp + .mylab-comp{margin-top:18px;padding-top:14px;border-top:1px dashed var(--border)}
.mylab-comp .comp-h{font-weight:700;font-size:.85rem;margin:0 0 4px}
table.rng .grp{color:var(--text2);font-size:.82rem}
table.rng .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
/* descriptive ranges (qualitative tests, films, cultures) are sentences, not
   numbers — they must wrap rather than be clipped by the nowrap above */
table.rng .val.wrap{white-space:normal;font-weight:600;line-height:1.45}
.unitnote{font-size:.76rem;color:var(--text3);margin-top:8px;font-style:italic}

.alert{padding:11px 13px;border-radius:9px;font-size:.86rem;margin-bottom:10px;line-height:1.45}
.alert.crit{background:var(--danger-soft);color:var(--danger);border:1px solid currentColor}
.alert.warn{background:var(--warn-soft);color:var(--warn);border:1px solid currentColor}
.alert.info{background:var(--accent-soft);color:var(--accent-text)}
.alert b{font-weight:700}

.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text2);flex:none;width:33%;font-size:.82rem}
.kv .v{flex:1}

/* tube pill */
.tubepill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--border);font-size:.85rem;font-weight:600}
.tubedot{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);flex:none}

/* ===================== FORMS / TOOLS ===================== */
label.fl{display:block;font-size:.78rem;color:var(--text2);margin:12px 0 5px;font-weight:600}
input.fi,select.fi,textarea.fi{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface2);outline:none}
input.fi:focus,select.fi:focus,textarea.fi:focus{border-color:var(--accent)}
.btn{padding:11px 16px;border-radius:9px;background:var(--accent);color:#fff;
  font-weight:650;font-size:.9rem;display:inline-block;text-align:center}
[data-theme="dark"] .btn{color:#06211e}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.dgr{background:var(--danger);color:#fff}
.btn.wide{width:100%;display:block;margin-top:12px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}

.picker-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border);width:100%;text-align:left;background:var(--surface)}
.picker-item:last-child{border-bottom:none}
.cb{width:21px;height:21px;border-radius:5px;border:2px solid var(--border);flex:none;
  display:grid;place-items:center;font-size:.8rem;color:#fff}
.cb.on{background:var(--accent);border-color:var(--accent)}
[data-theme="dark"] .cb.on{color:#06211e}

.result-flag{padding:14px;border-radius:10px;text-align:center;font-weight:700;margin-top:12px;font-size:1rem}
.rf-normal{background:var(--ok-soft);color:var(--ok)}
.rf-high{background:var(--danger-soft);color:var(--danger)}
.rf-low{background:var(--warn-soft);color:var(--warn)}

/* ===================== BOTTOM NAV ===================== */
#nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;
  background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
#nav button{flex:1;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--text3);font-size:.65rem;font-weight:600}
#nav button .ni{font-size:1.25rem;line-height:1}
#nav button.on{color:var(--accent)}

/* ===================== IN-APP DIALOG =====================
   Replaces window.confirm()/alert(). A WebView renders those with its own
   chrome, which prefixes the message with 'The page at
   "https://appassets.androidplatform.net" says:' — the asset origin the
   APK serves from. Correct for a web page, wrong for what the user sees
   as an app, and alarming on a destructive action. This also makes the
   dialogs themeable and testable with ordinary selectors. */
#dlgWrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);padding:24px}
#dlgWrap.on{display:flex}
#dlg{background:var(--surface);color:var(--text);border-radius:14px;border:1px solid var(--border);
  max-width:420px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#dlg h3{font-size:1.05rem;font-weight:700;margin-bottom:8px}
#dlg p{font-size:.92rem;line-height:1.55;color:var(--text2);white-space:pre-line}
#dlg .btnrow{margin-top:18px}

.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:.9rem}
.muted{color:var(--text2);font-size:.84rem}
.handout{background:var(--surface);padding:18px;border-radius:10px;border:1px solid var(--border);
  font-size:.92rem;line-height:1.65;white-space:pre-wrap}
@media print{
  #appbar,#nav,#searchWrap,#modebar,.noprint{display:none!important}
  body{background:#fff;padding:0}
  .handout{border:none;padding:0}
}
</style>
</head>
<body data-theme="light">

<header id="appbar">
  <div class="bar-row">
    <button class="iconbtn" id="backBtn" aria-label="Back">‹</button>
    <div class="title">LabRef<span class="ver" id="appVer"></span></div>
    <button class="iconbtn" id="searchToggle" aria-label="Search">⌕</button>
  </div>
  <nav class="sub" id="crumbs" aria-label="Page address"></nav>
</header>

<div id="searchWrap" style="display:none">
  <input id="searchBox" type="search" placeholder="Search tests, abbreviations, synonyms…" autocomplete="off">
</div>

<div id="modebar">
  <button class="chip" data-mode="units">Units: Conventional</button>
  <button class="chip" data-mode="sex">Male</button>
  <button class="chip" data-mode="age">Adult</button>
  <button class="chip" data-mode="preg">Not pregnant</button>
</div>

<main>
  <section id="v-tests"  class="view active"></section>
  <section id="v-tools"  class="view"></section>
  <section id="v-tubes"  class="view"></section>
  <section id="v-mylab"  class="view"></section>
  <section id="v-more"   class="view"></section>
  <section id="v-detail" class="view"></section>
</main>

<nav id="nav">
  <button data-nav="tests" class="on"><span class="ni">☰</span>Tests</button>
  <button data-nav="tools"><span class="ni">⚗</span>Tools</button>
  <button data-nav="tubes"><span class="ni">▮</span>Tubes</button>
  <button data-nav="mylab"><span class="ni">⌂</span>My Lab</button>
  <button data-nav="more"><span class="ni">⚙</span>More</button>
</nav>

<div id="dlgWrap" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div id="dlg">
    <h3 id="dlgTitle"></h3>
    <p id="dlgBody"></p>
    <div class="btnrow">
      <button class="btn sec" id="dlgCancel">Cancel</button>
      <button class="btn" id="dlgOk">OK</button>
    </div>
  </div>
</div>

<script>
/*__LABREF_DATA__*/

<script>
/* ============================================================================
   LabRef — APPLICATION  (version comes from LABREF_VERSION in the data module)
   All state in localStorage. No network calls. No permissions required.
   ========================================================================== */
(function(){
"use strict";

const LS = "labref_v1";
const LS_LEGACY = "medref_v1";   /* pre-rename key — read once, then migrated */
const TESTS = window.LABREF_TESTS, CATS = window.LABREF_CATEGORIES, TUBES = window.LABREF_TUBES;
const tubeById = id => TUBES.find(t=>t.id===id) || null;
const testById = id => TESTS.find(t=>t.id===id) || null;
const catById  = id => CATS.find(c=>c.id===id) || null;

/* ---------------------------------------------------------------- STATE */
/* [theme id, display label] -- id must match a [data-theme="id"] CSS block
   above and have an entry in the THEME_COLORS meta-tag map below. */
const THEME_LABELS = [
  ["light","Light"], ["dark","Dark"], ["sepia","Sepia"],
  ["pista","Pista Green"], ["beige","Beige"], ["steel","Brushed Steel"]
];
const defaults = {
  theme:"light", fs:100, units:"conv",
  sex:"M", age:"adult", preg:"none",
  favs:[], notes:{}, local:{}, localOnly:false,
  labName:"", labAnalyser:"", labNabl:"",
  picker:[], recent:[],
  panels:{}          /* persisted open/closed state of the Tests tab panels */
};
/* A DEEP copy of defaults. Object.assign({}, defaults) is shallow, so every
   state object built that way shared ONE live reference to defaults.local,
   defaults.panels and defaults.picker. Since those are mutated in place
   (S.local[id]=…, delete S.local[id], S.panels[id]=…, S.picker.push(…)),
   the defaults object itself accumulated the user's data — and "Reset all
   settings and local values", which rebuilt S from defaults, handed those
   same polluted objects straight back. Reported from the APK: reset ran,
   said nothing, and every saved lab value was still there. A reset that
   silently fails to erase is worse than no reset button, because the
   clinician believes the device is clean. */
const freshState = () => JSON.parse(JSON.stringify(defaults));
let S = freshState();
/* Read the current key; fall back to the pre-rename key so a user who already
   saved their lab's values under MedRef does not silently lose them. The old
   key is left in place rather than deleted — migration is one-way and cheap,
   and leaving it costs nothing if the user reverts to an older build. */
let migratedFromLegacy = false;
try {
  let raw = localStorage.getItem(LS);
  if(!raw){ raw = localStorage.getItem(LS_LEGACY); if(raw) migratedFromLegacy = true; }
  if(raw) S = Object.assign(freshState(), JSON.parse(raw));
} catch(e){}

/* Everything above this line is untrusted input: a stored blob written by an
   older build, a backup file the user restored, a hand-edited profile. The
   app then indexes into S.local / S.favs / S.panels and compares S.sex /
   S.age / S.preg without checking either. Two failure modes, both reachable
   through the app's own Restore button:
     - a null container ({"local":null}, {"favs":null}) throws on the first
       lookup and leaves the Tests tab permanently blank — the app is simply
       dead until storage is cleared, which the user has no way to do from a
       screen that won't render;
     - a patient mode that is not one of the known values ({"preg":"BOGUS"})
       throws nothing at all and silently matches NO range row, so the test
       opens with an empty reference table. In a clinical reference app that
       quiet version is the more dangerous of the two.
   Only panels was guarded before, and only on load, not on restore. */
const AGES = ["neonate","infant","child","adolescent","adult"];
const PREGS = ["none","T1","T2","T3"];
function normalizeState(){
  ["notes","local","panels"].forEach(k=>{
    if(!S[k] || typeof S[k]!=="object" || Array.isArray(S[k])) S[k] = {};
  });
  ["favs","picker","recent"].forEach(k=>{ if(!Array.isArray(S[k])) S[k] = []; });
  if(!THEME_LABELS.some(([t])=>t===S.theme)) S.theme = defaults.theme;
  if(typeof S.fs!=="number" || !isFinite(S.fs) || S.fs<85 || S.fs>145) S.fs = defaults.fs;
  if(S.units!=="conv" && S.units!=="si") S.units = defaults.units;
  if(S.sex!=="M" && S.sex!=="F") S.sex = defaults.sex;
  if(!AGES.includes(S.age)) S.age = defaults.age;
  if(!PREGS.includes(S.preg)) S.preg = defaults.preg;
  if(typeof S.localOnly !== "boolean") S.localOnly = defaults.localOnly;
  ["labName","labAnalyser","labNabl"].forEach(k=>{
    if(typeof S[k] !== "string") S[k] = defaults[k];
  });
}
normalizeState();
const save = () => { try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} };
/* Write the migrated copy under the new key straight away, so the legacy
   fallback is needed exactly once and the two keys cannot drift apart. */
if(migratedFromLegacy) save();

/* ---------------------------------------------------------------- HELPERS */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ---- in-app dialogs ------------------------------------------------------
   window.confirm()/alert() are never used. Inside the APK's WebView they
   render with the browser's own chrome, which announces the asset origin
   ('The page at "https://appassets.androidplatform.net" says:') above the
   message — confusing in something presented as an offline app, and worst
   of all on the destructive reset, where it reads like a web page asking
   to delete the user's data. These render in-app instead: themed, keyboard
   dismissible, and assertable from the QA suite by selector.
   ask() resolves true/false; say() resolves when acknowledged. */
let dlgResolve = null;
function closeDlg(result){
  $("#dlgWrap").classList.remove("on");
  const r = dlgResolve; dlgResolve = null;
  if(r) r(result);
}
function openDlg(title, body, opts){
  opts = opts || {};
  $("#dlgTitle").textContent = title;
  $("#dlgBody").textContent  = body || "";
  $("#dlgBody").style.display = body ? "" : "none";
  const ok = $("#dlgOk"), cancel = $("#dlgCancel");
  ok.textContent = opts.okLabel || "OK";
  ok.classList.toggle("dgr", !!opts.danger);
  cancel.style.display = opts.confirm ? "" : "none";
  $("#dlgWrap").classList.add("on");
  ok.focus();
  return new Promise(res => { dlgResolve = res; });
}
const ask = (title, body, opts) => openDlg(title, body, Object.assign({confirm:true}, opts||{}));
const say = (title, body) => openDlg(title, body, {confirm:false});

/* Range text for one range object in the active unit system */
function rangeText(r, units){
  const u = units==="si" ? r.si : r.conv;
  if(!u) return "—";
  if(u.txt) return esc(u.txt);
  const lo = u.lo, hi = u.hi;
  if(lo!=null && hi!=null) return lo+" – "+hi;
  if(lo!=null) return "≥ "+lo;
  if(hi!=null) return "< "+hi;
  return "—";
}
function unitLabel(t){ return S.units==="si" ? t.units.si : t.units.conv; }

/* Does a range row apply to the current patient mode? */
function rangeMatches(r){
  if(r.sex!=="any" && r.sex!==S.sex) return false;
  if(r.age && r.age!==S.age) return false;
  if(r.preg){
    if(S.preg==="none") return false;
    if(r.preg!=="any" && r.preg!==S.preg) return false;
  } else {
    if(S.preg!=="none" && r.sex==="F") return false;
  }
  return true;
}
/* Score a candidate range so the MOST specific applicable row wins.
   Without this, a sex-neutral adult row outranks a trimester-specific one. */
function rangeScore(r){
  if(!rangeMatches(r)) return -1;
  let s = 0;
  if(S.preg!=="none"){
    if(r.preg===S.preg) s += 100;
    else if(r.preg==="any") s += 60;
  }
  if(r.sex===S.sex) s += 20;
  if(r.age===S.age) s += 10;
  return s;
}

/* -------------------------------------------------- PANEL / ANALYTE HELPERS
   A handful of tests (Lipid Profile, ABG Panel, PT/INR, Troponin, Bilirubin,
   Calcium) bundle more than one real, separately-reported analyte under one
   test record — see the analyte{} note in the schema header of the data file.
   Every function below is analyte-aware: for an ordinary single-analyte test,
   componentsOf() returns null and everything behaves exactly as before. */
function componentsOf(t){
  if(!t.ranges.some(r=>r.analyte)) return null;
  const seen=[], out=[];
  t.ranges.forEach(r=>{
    if(!r.analyte || seen.includes(r.analyte.key)) return;
    seen.push(r.analyte.key); out.push(r.analyte);
  });
  return out;
}
function rowsFor(t, key){
  return key==null ? t.ranges.filter(r=>!r.analyte) : t.ranges.filter(r=>r.analyte && r.analyte.key===key);
}
/* Score every row for a test/component and return the rows tied at the
   top score, alongside the full row list. Used by both bestRange() (which
   just needs ONE row) and tiedCandidates() (which needs to know when more
   than one row genuinely ties, so the interpreter can ask instead of guess).
   Scoped to kind "ref"/"method" only — a diagnostic/target/cutoff row is
   never a population reference interval, and letting one tie against a
   real ref row (or against another dx/cutoff/target row that just happens
   to share a demographic key) produced exactly the wrong "which group
   applies?" prompt for tests like Vitamin D, whose dx rows form a clean
   value-ordered ladder instead — see classifyAgainstLadder(). A test with
   no ref/method row at all (Vitamin D has none) correctly yields no match
   here; its content lives entirely in the ladder. */
function scoredCandidates(t, key){
  const comps = componentsOf(t);
  const rows = (comps ? rowsFor(t, key || comps[0].key) : t.ranges)
    .filter(r=> r.kind==="ref" || r.kind==="method" || r.kind==null);
  let bs = -1;
  const scored = rows.map(r=>({ r, s:rangeScore(r) }));
  scored.forEach(x=>{ if(x.s>bs) bs = x.s; });
  const top = bs>=0 ? scored.filter(x=>x.s===bs).map(x=>x.r) : [];
  return { top, rows };
}
/* The fallback below used to be rows.find(...) || rows[0] with no match
   check — safe back when `rows` was every range on the test, so there was
   always at least one genuinely generic row to fall back to. Now that
   scoredCandidates() kind-restricts `rows` to ref/method only (see above),
   a test whose general-population content is tagged dx/cutoff/target with
   no separate ref row (d-dimer: its two adult cutoffs are kind "cutoff",
   leaving only the three pregnancy-only "ref" rows in `rows`) could have
   NO row in `rows` that actually matches the current patient at all — the
   old unconditional rows[0] fallback then returned a pregnancy range for a
   male patient. Never return a row that fails rangeMatches(); returning
   null (no ref/method range available) is always safer than guessing. */
function bestRange(t, key){
  const { top, rows } = scoredCandidates(t, key);
  if(top[0]) return top[0];
  const matching = rows.filter(r=>rangeMatches(r));
  return matching.find(r=>r.age==="adult"&&r.sex==="any") || matching[0] || null;
}
/* When two or more ref/method rows score identically for the current
   patient mode — e.g. ESR "male <50y" and "male ≥50y" both just match
   sex=male, age=adult — there is no single correct pick. Returns the tied
   rows (2+) so the caller can make the user choose by label instead of
   silently taking the first one, or null when there's no genuine tie.
   qa/known_tie_groups.json tracks every test where this is expected;
   qa/validate_ties.js fails the build if a new, unreviewed tie shows up. */
function tiedCandidates(t, key){
  const { top } = scoredCandidates(t, key);
  return top.length>1 ? top : null;
}

/* ---------------------------------------------------- VALUE-ORDERED BANDS
   A dx/cutoff/target row is never matched by demographic chips the way a
   ref/method row is — "Vitamin D deficient / insufficient / sufficient /
   toxic" isn't four options for four different kinds of patient, it's four
   slices of the VALUE axis. Given a number, exactly one slice applies, and
   which one is a lookup, not a guess. These helpers find that slice — or,
   for the handful of tests where the rows genuinely aren't a clean ladder
   (same demographic key, but picking between them needs clinical context
   a number can't supply — e.g. anti-Xa's four rows differ by drug/dosing
   regimen, not by value), say so instead of pretending one is deducible. */
function ladderRowsFor(t, key){
  const comps = componentsOf(t);
  const rows = comps ? rowsFor(t, key || comps[0].key) : t.ranges;
  return rows.filter(r=> (r.kind==="dx"||r.kind==="cutoff"||r.kind==="target") && rangeMatches(r));
}
/* t is threaded through every helper below (added in Stage 3) so a local
   override — only ever possible on a cutoff row when the test is
   assayDep (see overridableKind()) — is honoured in the ladder the same
   way it's honoured in the ref/method comparison, via effectiveBounds(). */
function bandBounds(t, r){
  const eb = effectiveBounds(t, r);
  return [ eb.lo!=null ? eb.lo : -Infinity, eb.hi!=null ? eb.hi : Infinity ];
}
/* True when every pair of rows is either non-overlapping or one fully
   contains the other (a severity refinement, e.g. "deficient <20" wholly
   containing "severely deficient <10") — the two shapes a real value
   ladder takes. Any other overlap means picking between them needs
   something a number alone can't supply. */
function isValueLadder(t, rows){
  const withBounds = rows.filter(r=>{ const eb=effectiveBounds(t,r); return eb.lo!=null||eb.hi!=null; });
  if(withBounds.length < rows.length) return false;   // a non-numeric row can't be placed on the axis
  for(let i=0;i<withBounds.length;i++) for(let j=i+1;j<withBounds.length;j++){
    const [alo,ahi]=bandBounds(t,withBounds[i]), [blo,bhi]=bandBounds(t,withBounds[j]);
    if(alo<bhi && blo<ahi){                            // intervals overlap at all
      const nested = (alo<=blo && bhi<=ahi) || (blo<=alo && ahi<=bhi);
      if(!nested) return false;
    }
  }
  return withBounds.length>0;
}
/* The narrowest (most specific) band containing v, so a nested refinement
   ("severely deficient", inside "deficient") wins over the broader band it
   sits inside. When v falls in none of them — below the lowest band's
   floor or above the highest band's ceiling, which happens whenever a
   ladder doesn't cover the full axis (a single cutoff row is the extreme
   case: only one "band" exists at all) — returns the nearest edge row
   instead, flagged so the caller reports "below/above" rather than
   pretending the value matched it. */
function bandForValue(t, rows, v){
  let best=null, bestWidth=Infinity;
  rows.forEach(r=>{
    const [lo,hi] = bandBounds(t,r);
    if(v>=lo && v<hi){
      const w = hi-lo;
      if(w<bestWidth){ bestWidth=w; best=r; }
    }
  });
  if(best) return { row:best, dir:null };
  let nearest=null, nearestDist=Infinity, nearestDir=null;
  rows.forEach(r=>{
    const [lo,hi] = bandBounds(t,r);
    const dist = v<lo ? lo-v : v-hi;
    const dir = v<lo ? "below" : "above";
    if(dist<nearestDist){ nearestDist=dist; nearest=r; nearestDir=dir; }
  });
  return nearest ? { row:nearest, dir:nearestDir } : null;
}
/* Entry point for the Result Interpreter: classify a value against this
   test/component's dx/cutoff/target rows for the current patient mode.
   Returns null (nothing to classify), {row} (a clean ladder pick), or
   {needsChoice:true, choices} (rows that need clinical context, not a
   value, to choose between — shown as reference info, not forced). */
function classifyAgainstLadder(t, key, v){
  const rows = ladderRowsFor(t, key);
  if(!rows.length) return null;
  if(rows.length===1 || isValueLadder(t, rows)){
    const picked = bandForValue(t, rows, v);
    return picked ? { row:picked.row, dir:picked.dir } : null;
  }
  return { needsChoice:true, choices: rows };
}
/* The unit label and conversion factor for one component, falling back to
   the test's panel-level default when the component doesn't override it. */
function componentUnit(t, an){
  if(!an) return { conv:t.units.conv, si:t.units.si, factor:t.units.factor, noConvert:false };
  return {
    conv: an.convUnit!=null ? an.convUnit : t.units.conv,
    si:   an.siUnit!=null   ? an.siUnit   : t.units.si,
    factor: an.factor!=null ? an.factor : t.units.factor,
    noConvert: !!an.noConvert
  };
}

/* ---- local ("My Lab") override storage ----------------------------------
   v2.0 Stage 3 shape: S.local[id] = { note, assay:{[key]:{unit,method,crit}},
   byRid:{[rid]:{lo,hi}} }. An override is now scoped to the SPECIFIC
   published row (rid) it replaces, not to the whole component — this is the
   actual fix for the defect this rebuild exists for (see CHANGELOG's "The
   defect"): the old shape keyed an override by component alone, with no
   demographic dimension at all, so a saved "adult male" value silently
   applied to every stratum of that component, including newborn and
   pregnant patients. unit/method/crit stay at the assay (component) level,
   because a lab's own analyser and critical-value policy don't vary by
   patient demographic the way its reference numbers do.
   overridableKind() gates which rows may ever carry a byRid entry: a lab can
   publish its own reference interval (kind ref/method), and — when the test
   itself is flagged assayDep — its own assay-specific decision cutoff, but
   it can never redefine a diagnostic band or a guideline treatment target
   (kind dx/target), which are set by clinical consensus, not the local
   analyser. */
function overridableKind(r, t){
  return r.kind==="ref" || r.kind==="method" || r.kind==null || (r.kind==="cutoff" && !!t.assayDep);
}
function localBlob(id){
  const L = S.local[id];
  if(!L) return { note:"", assay:{}, byRid:{} };
  if(L.byRid || L.assay) return { note:L.note||"", assay:L.assay||{}, byRid:L.byRid||{} };
  /* Pre-Stage-3 shape (comp:{key:{lo,hi,unit,crit,method}}), or the even
     older flat single-component shape before panels existed. Never silently
     applied under the new rid-scoped lookup — surfaced instead via
     orphanedOverrides() so nothing a clinician saved just vanishes, or worse,
     silently reapplies to the wrong stratum. */
  const legacy = L.comp ? L.comp : { _:{ lo:L.lo, hi:L.hi, unit:L.unit, crit:L.crit, method:L.method } };
  return { note:L.note||"", assay:{}, byRid:{}, legacy };
}
function commitLocal(id, L){
  const empty = !L.note && !Object.keys(L.assay).length && !Object.keys(L.byRid).length;
  if(empty) delete S.local[id];
  else S.local[id] = { note:L.note, assay:L.assay, byRid:L.byRid };
}
function assayOverride(id, key){
  const a = localBlob(id).assay[key||"_"];
  if(!a) return null;
  /* Unit alone never counts as "saved" — the unit field is pre-filled with
     the textbook default so the input is never blank, and that default
     left untouched carries no information worth persisting or badging as
     local. Only a method or a critical value, actually typed, does. */
  if(!a.method && !a.crit) return null;
  return a;
}
function ridOverride(id, rid){
  const o = localBlob(id).byRid[rid];
  if(!o) return null;
  if((o.lo==null||o.lo==="") && (o.hi==null||o.hi==="")) return null;
  return o;
}
function saveAssay(id, key, data){
  const L = localBlob(id);
  L.assay[key||"_"] = data;
  Object.keys(L.assay).forEach(k=>{ const a=L.assay[k]; if(!(a.method||a.crit)) delete L.assay[k]; });
  commitLocal(id, L);
}
function saveRid(id, rid, data){
  const L = localBlob(id);
  L.byRid[rid] = data;
  Object.keys(L.byRid).forEach(k=>{ const o=L.byRid[k]; if(!(o.lo||o.hi)) delete L.byRid[k]; });
  commitLocal(id, L);
}
function saveNote(id, note){
  const L = localBlob(id);
  L.note = note;
  commitLocal(id, L);
}
function hasLocal(id){
  const t = testById(id); if(!t) return false;
  const L = localBlob(id);
  if(L.note) return true;
  if(Object.keys(L.assay).some(k=>{ const a=L.assay[k]; return !!(a.method||a.crit); })) return true;
  if(Object.keys(L.byRid).some(k=>{ const o=L.byRid[k]; return !!(o.lo||o.hi); })) return true;
  if(L.legacy) return true;
  return false;
}
/* Every stored value for this test that no longer maps onto a currently-
   overridable row: a rid retired or reclassified out of ref/method/
   assayDep-cutoff since the value was saved, an assay entry for a component
   that no longer exists, or data in a pre-Stage-3 shape. Surfaced in the My
   Lab editor rather than silently dropped or silently misapplied — the
   clinician decides whether to re-enter it against the row it now belongs
   to, or clear it. */
function orphanedOverrides(t){
  const L = localBlob(t.id);
  const out = [];
  const fmt = o => [o.lo&&o.hi?`${o.lo}–${o.hi}`:(o.lo?`≥${o.lo}`:o.hi?`<${o.hi}`:null)].filter(Boolean).join("");
  if(L.legacy){
    Object.keys(L.legacy).forEach(key=>{
      const c = L.legacy[key];
      if(!(c.lo||c.hi||c.crit||c.method)) return;
      const an = (componentsOf(t)||[]).find(a=>a.key===key);
      const label = an ? an.label+": " : "";
      out.push(label+"saved before this app version tracked which row a value belongs to — "+
        [fmt(c), c.unit, c.method?`(${c.method})`:null, c.crit?`critical: ${c.crit}`:null].filter(Boolean).join(" "));
    });
  }
  const validRids = new Set(t.ranges.filter(r=>overridableKind(r,t)).map(r=>r.rid));
  Object.keys(L.byRid).forEach(rid=>{
    const o = L.byRid[rid]; if(!(o.lo||o.hi)) return;
    if(validRids.has(rid)) return;
    const row = t.ranges.find(r=>r.rid===rid);
    out.push(row
      ? `"${row.grp}" is no longer an editable row (reclassified as ${row.kind||"a guideline band"}) — your saved value (${fmt(o)}) no longer applies.`
      : `A saved value for a row that no longer exists on this test — your lab's number (${fmt(o)}) is no longer used.`);
  });
  const validKeys = new Set([...(componentsOf(t)||[]).map(a=>a.key), "_"]);
  Object.keys(L.assay).forEach(key=>{
    const a = L.assay[key]; if(!(a.method||a.crit)) return;
    if(validKeys.has(key)) return;
    out.push(`A saved unit/method/critical value for a component that no longer exists on this test.`);
  });
  return out;
}
/* Short summary of what's saved for one test, for the My Lab index list —
   every overridden row's own label and numbers, plus the first saved
   method (labs normally run one assay per test, so one is enough to show
   at a glance; the test's own detail page has the full per-component
   breakdown). */
function summarizeLocal(t){
  const L = localBlob(t.id);
  const ranges = Object.keys(L.byRid).map(rid=>{
    const o = L.byRid[rid]; if(!(o.lo||o.hi)) return null;
    const row = t.ranges.find(r=>r.rid===rid);
    const val = [o.lo,o.hi].filter(v=>v).join(" – ");
    return row ? `${row.grp}: ${val}` : val;
  }).filter(Boolean);
  const method = Object.values(L.assay).map(a=>a.method).filter(Boolean)[0] || "";
  return { ranges, method };
}
const num = v => (v===""||v==null||isNaN(parseFloat(v))) ? null : parseFloat(v);

/* The bounds actually in force for one range row: the clinician's own saved
   value when the row is overridable and one is saved, otherwise the
   textbook number. Used by BOTH the ref/method comparison (activeRange())
   and the value-ladder classification (classifyAgainstLadder()), so a local
   override is honoured wherever that row's numbers are consulted. */
function effectiveBounds(t, r){
  if(overridableKind(r, t)){
    const ov = ridOverride(t.id, r.rid);
    if(ov) return { lo:num(ov.lo), hi:num(ov.hi), local:true };
  }
  const u = S.units==="si" ? r.si : r.conv;
  return { lo: u&&u.lo!=null?u.lo:null, hi: u&&u.hi!=null?u.hi:null, local:false };
}

/* The ref/method row in force for the current patient mode, with any saved
   local override substituted for its numbers — never its label: "grp"
   always names the real demographic group an override applies to, so a
   clinician is never shown a bare "Your lab" with no indication of which
   stratum it is (the defect this rebuild exists to fix). forcedRid lets a
   caller that has already resolved a tie (see tiedCandidates()) pin the
   exact row instead of falling through to bestRange()'s guess. */
function activeRange(t, key, forcedRid){
  const comps = componentsOf(t);
  const compKey = comps ? (key || comps[0].key) : null;
  const tie = tiedCandidates(t, compKey);
  let r = null;
  if(forcedRid && tie) r = tie.find(x=>x.rid===forcedRid) || null;
  if(!r) r = bestRange(t, compKey);
  if(!r) return null;
  const eb = effectiveBounds(t, r);
  return { local:eb.local, grp:r.grp, lo:eb.lo, hi:eb.hi,
           txt: eb.local ? null : (S.units==="si"?r.si:r.conv).txt,
           tie: (!forcedRid && !!tie) || null };
}

/* ---------------------------------------------------------------- SEARCH */
function searchTests(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const toks = q.split(/\s+/);
  return TESTS.map(t=>{
    const hay = (t.name+" "+t.abbr+" "+t.syn.join(" ")+" "+(catById(t.cat)||{}).name).toLowerCase();
    let score = 0;
    for(const tk of toks){
      if(!hay.includes(tk)) return null;
      if(t.abbr.toLowerCase()===tk) score += 100;
      else if(t.name.toLowerCase().startsWith(tk)) score += 50;
      else if(t.syn.some(s=>s.toLowerCase()===tk)) score += 40;
      else score += 10;
    }
    return {t, score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).map(x=>x.t);
}

/* ---------------------------------------------------------------- NAV */
let navStack = [];
let current = "tests";

function go(view, push){
  if(push && current!=="detail") navStack.push(current);
  current = view;
  $$(".view").forEach(v=>v.classList.remove("active"));
  $("#v-"+view).classList.add("active");
  const isDetail = view==="detail";
  $("#backBtn").style.display = (isDetail || navStack.length) ? "grid" : "none";
  $("#modebar").style.display = (view==="tests"||view==="detail"||view==="tools") ? "flex" : "none";
  $$("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.nav===view));
  renderCrumbs();
  window.scrollTo(0,0);
}
$("#backBtn").onclick = ()=>{ const p = navStack.pop() || "tests"; current="x"; go(p); render(); };
$$("#nav button").forEach(b=> b.onclick = ()=>{
  navStack=[];
  /* tapping a tab you are already inside returns to that tab's top level */
  if(b.dataset.nav==="tools") toolView=null;
  if(b.dataset.nav==="tests"){ activeCat=null; $("#searchBox").value=""; }
  go(b.dataset.nav); render();
});

/* ------------------------------------------------ BREADCRUMB "page address" */
/* Shows where you are as a tappable trail: Tests › Lipids › Lipid Profile.
   Every segment but the last navigates. A test's trail always names its own
   category, whatever route was taken to reach it, so the crumb reads as the
   test's address rather than as browser history. */
const NAV_LABEL  = {tests:"Tests", tools:"Tools", tubes:"Tubes", mylab:"My Lab", more:"More"};
const TOOL_LABEL = {picker:"Tube Picker", interp:"Result Interpreter",
                    reverse:"Reverse Lookup", handout:"Prep Handout"};

function crumbTrail(){
  if(current==="detail"){
    const t = testById(detailId);
    const trail = [{label:"Tests", act:"root:tests"}];
    const c = t && catById(t.cat);
    if(c) trail.push({label:c.name, act:"cat:"+c.id});
    trail.push({label: t ? t.name : "Test"});
    return trail;
  }
  const trail = [{label: NAV_LABEL[current] || "", act:"root:"+current}];
  if(current==="tests"){
    const q = ($("#searchBox").value||"").trim();
    if(q) trail.push({label:"Search: "+q});
    else if(activeCat){ const c = catById(activeCat); if(c) trail.push({label:c.name}); }
  }
  if(current==="tools" && toolView) trail.push({label: TOOL_LABEL[toolView] || toolView});
  return trail;
}

function renderCrumbs(){
  const trail = crumbTrail(), el = $("#crumbs");
  if(!el) return;
  el.innerHTML = trail.map((c,i)=>{
    const last = i === trail.length-1;
    const cls  = "crumb" + (last ? " now" : (c.act ? " link" : "")) +
                 (i===0 && !last ? " root" : "") +
                 (i>0 && !last ? " mid" : "");
    const attr = (!last && c.act) ? ` data-crumb="${esc(c.act)}"` : "";
    return (i ? `<span class="csep">›</span>` : "") +
           `<span class="${cls}"${attr}>${esc(c.label)}</span>`;
  }).join("");
  el.querySelectorAll("[data-crumb]").forEach(s=> s.onclick = ()=>{
    const i = s.dataset.crumb.indexOf(":");
    const kind = s.dataset.crumb.slice(0,i), val = s.dataset.crumb.slice(i+1);
    navStack = [];
    if(kind==="root"){
      if(val==="tools") toolView = null;
      if(val==="tests"){ activeCat = null; $("#searchBox").value = ""; }
      go(val);
    } else if(kind==="cat"){
      activeCat = val; $("#searchBox").value = ""; go("tests");
    }
    render();
  });
}

/* ---------------------------------------------------------------- RENDER: TESTS */
let activeCat = null;

function renderTests(){
  renderCrumbs();
  const q = $("#searchBox").value;
  const el = $("#v-tests");

  if(q.trim()){
    const res = searchTests(q);
    el.innerHTML = `<h2 class="sec">${res.length} result${res.length===1?"":"s"}</h2>`
      + (res.length ? `<div class="card">${res.map(testRow).join("")}</div>`
                    : `<div class="empty">No test matches “${esc(q)}”.<br><span class="muted">Try an abbreviation such as KFT, TLC or ABG.</span></div>`);
    bindRows(el); return;
  }

  if(activeCat){
    const c = catById(activeCat);
    const list = TESTS.filter(t=>t.cat===activeCat);
    el.innerHTML = `<h2 class="sec">${esc(c.name)} · ${list.length} test${list.length===1?"":"s"}</h2>`
      + (list.length ? `<div class="card">${list.map(testRow).join("")}</div>`
                     : `<div class="empty">No records in this category yet.<br><span class="muted">Scheduled for a later version.</span></div>`);
    bindRows(el); return;
  }

  const favs = S.favs.map(testById).filter(Boolean);
  const recent = S.recent.map(testById).filter(Boolean).slice(0,5);
  const catRows = CATS.map(c=>{
    const n = TESTS.filter(t=>t.cat===c.id).length;
    return `<button class="row" data-cat="${c.id}">
      <span class="ic" style="background:${c.color}">${c.icon}</span>
      <span class="bd"><span class="nm">${esc(c.name)}</span>
        <span class="ds">${n} test${n===1?"":"s"}${n===0?" · coming in a later version":""}</span></span>
      <span class="ch">›</span></button>`;
  }).join("");

  let h = "";
  if(favs.length)   h += block(`Favourites · ${favs.length}`, "p-favs",
                       favs.map(testRow).join(""), panelOpen("p-favs"), {flush:true,persist:true});
  if(recent.length) h += block(`Recently viewed · ${recent.length}`, "p-recent",
                       recent.map(testRow).join(""), panelOpen("p-recent"), {flush:true,persist:true});
  h += block(`Categories · ${CATS.length}`, "p-cats",
         catRows, panelOpen("p-cats"), {flush:true,persist:true});
  el.innerHTML = h;
  bindRows(el);
  bindBlocks(el);
  el.querySelectorAll("[data-cat]").forEach(b=> b.onclick = ()=>{ activeCat=b.dataset.cat; renderTests(); window.scrollTo(0,0); });
}

function testRow(t){
  const c = catById(t.cat) || {color:"#789"};
  const comps = componentsOf(t);
  let d;
  if(comps){
    /* A panel bundles several analytes — no single number can represent the
       whole test, so the list shows what it contains rather than guessing. */
    d = comps.length + " components: " + comps.map(a=>a.label).join(", ");
  } else {
    const r = activeRange(t);
    d = r ? (r.txt ? r.txt : (r.lo!=null&&r.hi!=null ? r.lo+"–"+r.hi : r.lo!=null ? "≥"+r.lo : r.hi!=null ? "<"+r.hi : "—")) : "—";
    if(t.units.conv!=="Qualitative" && t.units.conv!=="Titre + pattern") d += " " + unitLabel(t);
  }
  return `<button class="row" data-test="${t.id}">
    <span class="ic" style="background:${c.color}">${esc(t.abbr.slice(0,3))}</span>
    <span class="bd"><span class="nm">${esc(t.name)}</span><span class="ds">${esc(d)}</span></span>
    ${hasLocal(t.id)?'<span class="dot" title="Local value set"></span>':''}
    <span class="ch">›</span></button>`;
}
function bindRows(scope){
  scope.querySelectorAll("[data-test]").forEach(b=> b.onclick = ()=> openTest(b.dataset.test));
}

/* ---------------------------------------------------------------- RENDER: DETAIL */
let detailId = null;
function openTest(id){
  detailId = id;
  S.recent = [id].concat(S.recent.filter(x=>x!==id)).slice(0,8); save();
  go("detail", true); renderDetail();
}

function qualitativeTest(t){ return t.units.conv==="Qualitative"||t.units.conv==="Titre + pattern"; }

/* One component's range table + its own conversion footnote (component may
   be null, meaning "the whole test" for an ordinary single-analyte test). */
function componentRangeHtml(t, an){
  const key = an ? an.key : null;
  const cu = componentUnit(t, an);
  /* A genuine tie (see tiedCandidates()) means more than one row equally
     matches the current patient mode — e.g. ESR "male <50y" and "male
     ≥50y" both just match sex=male, age=adult. Highlighting only the
     array's first one as "the" match would silently suggest a pick this
     app never actually made on clinical grounds. Highlight every tied row
     instead and say so, so the clinician picks by eye from the labels. */
  const tie = tiedCandidates(t, key);
  const br = bestRange(t, key);
  /* Neither a ref/method winner nor a ref/method tie: the test's
     general-population content may live entirely in dx/cutoff/target rows
     with no separate ref row at all (d-dimer's two adult exclusion
     cutoffs are kind "cutoff" — see qa/known_tie_groups.json's
     ladder_fallback_groups). The detail page has no entered value to run
     classifyAgainstLadder() against, so it falls back to showing
     whichever such rows demographically match the current patient mode,
     with the same "pick by eye" treatment as a ref/method tie. */
  const demoFallback = (!tie && !br)
    ? rowsFor(t,key).filter(r=>rangeMatches(r) && r.kind!=="ref" && r.kind!=="method" && r.kind!=="note")
    : null;
  const highlightSet = tie || (demoFallback && demoFallback.length ? demoFallback : null);
  /* Overrides are per-row (per-rid) since Stage 3 — each row shows its own
     saved value inline, under its own textbook number, rather than one
     summary row standing in for the whole component. S.localOnly swaps the
     textbook number out for the override on just the rows that have one;
     rows with nothing saved are unaffected either way. */
  let rows = "";
  rowsFor(t,key).forEach(r=>{
    const m = highlightSet ? highlightSet.includes(r) : (r===br);
    const unitSuffix = qualitativeTest(t) ? "" : " "+esc(S.units==="si"?cu.si:cu.conv);
    const rtxt = rangeText(r,S.units);
    const ov = overridableKind(r,t) ? ridOverride(t.id, r.rid) : null;
    const ovTxt = ov ? esc((ov.lo||"")+(ov.lo&&ov.hi?" – ":"")+(ov.hi||""))+unitSuffix : "";
    let valHtml;
    if(ov && S.localOnly) valHtml = `${ovTxt} <span class="badge b-local">Your lab</span>`;
    else if(ov) valHtml = `${rtxt}${unitSuffix}<br><span class="muted">Your lab: ${ovTxt}</span> <span class="badge b-local" style="font-size:.65rem">Your lab</span>`;
    else valHtml = `${rtxt}${unitSuffix}`;
    rows += `<tr class="${m?'match':''}"><td class="grp">${esc(r.grp)}</td><td class="val wrap">${valHtml}</td></tr>`;
  });
  let footnote = "";
  if(!qualitativeTest(t) && !cu.noConvert){
    const multi = highlightSet && highlightSet.length>1;
    footnote = `<div class="unitnote">Showing ${S.units==="si"?"SI":"conventional"} units (${esc(S.units==="si"?cu.si:cu.conv)}).
      ${cu.factor?`Conversion: ${esc(cu.conv)} × ${cu.factor} = ${esc(cu.si)}.`:""}
      ${multi ? "More than one highlighted row matches your current patient mode — pick the one that actually fits (see each row's own label) rather than trusting a single one."
            : "Highlighted row matches the current patient mode."}</div>`;
  }
  return rows + footnote;
}

/* Full "Reference ranges" block body — one table for a simple test, or one
   table per bundled analyte plus any patient-mode-only info rows for a panel. */
function rangeSectionHtml(t){
  const comps = componentsOf(t);
  if(!comps){
    return `<table class="rng"><thead><tr><th>Group</th><th>Range</th></tr></thead><tbody>${componentRangeHtml(t,null)}</tbody></table>
      <div class="unitnote">Reference intervals are method- and population-dependent. Always defer to the interval printed on your own laboratory's report.</div>`;
  }
  let html = `<div class="alert info"><b>This test reports ${comps.length} separate values</b> — each has its own range, unit and My Lab override below.</div>`;
  comps.forEach(an=>{
    html += `<div class="rng-sub"><div class="comp-h">${esc(an.label)}</div>
      <table class="rng"><thead><tr><th>Group</th><th>Range</th></tr></thead><tbody>${componentRangeHtml(t,an)}</tbody></table></div>`;
  });
  const infoRows = t.ranges.filter(r=>!r.analyte);
  if(infoRows.length){
    /* These are patient-mode-specific notes (e.g. the expected compensated
       respiratory alkalosis pattern in pregnancy), not a bundled analyte --
       still highlight the row when it matches the current patient mode,
       exactly as a normal range row would be. */
    html += `<div class="rng-sub"><div class="comp-h">Also note</div>
      <table class="rng"><tbody>${infoRows.map(r=>`<tr class="${rangeMatches(r)?'match':''}"><td class="grp">${esc(r.grp)}</td><td class="val${rangeText(r,S.units).length>24?' wrap':''}">${rangeText(r,S.units)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  html += `<div class="unitnote" style="margin-top:12px">Reference intervals are method- and population-dependent. Always defer to the interval printed on your own laboratory's report.</div>`;
  return html;
}

/* "Your lab's values" block body — one override sub-form per component. */
/* "Your lab's values" block body — assay-level unit/method/critical value
   per component, plus one lo/hi override input per overridable row
   (ref/method always, cutoff only on an assayDep test — see
   overridableKind()). A diagnostic band or treatment target is a guideline
   fixed by clinical consensus, not a lab measurement, so it is never
   offered an input here; its rows are named instead, so it's clear nothing
   is missing by accident. */
function myLabBlockHtml(t){
  const comps = componentsOf(t);
  const list = comps || [null];
  const orphans = orphanedOverrides(t);
  let html = `<p class="muted">Stored on this device only. Overrides the textbook range above and is used by the Result Interpreter.</p>`;
  if(orphans.length){
    html += `<div class="alert warn"><b>${orphans.length===1?"A saved value no longer applies":"Saved values no longer apply"}:</b>
      <ul class="lst" style="margin:6px 0 0">${orphans.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
      Use "Clear all" below, or re-enter it against the row it now belongs to.</div>`;
  }
  list.forEach(an=>{
    /* rowsFor() special-cases a literal null key for a non-panel test
       (its rows carry no .analyte at all) -- "_" is only the storage key
       used once persisted, so the two must not be conflated here. */
    const key = an ? an.key : null;
    const a = assayOverride(t.id, key) || {};
    const cu = componentUnit(t, an);
    const rows = rowsFor(t, key);
    const editable = rows.filter(r=>overridableKind(r,t));
    const locked = rows.filter(r=>!overridableKind(r,t) && r.kind!=="note");
    html += `<div class="mylab-comp" data-key="${esc(key||"_")}">
      ${an?`<div class="comp-h">${esc(an.label)}</div>`:""}
      <label class="fl">Unit as your lab reports it</label><input class="fi lc-unit" value="${esc(a.unit||cu.conv||unitLabel(t))}">
      <label class="fl">Method / analyser</label><input class="fi lc-method" value="${esc(a.method||"")}" placeholder="e.g. CLIA, Beckman DxI 800">
      <label class="fl">Your critical / panic value</label><input class="fi lc-crit" value="${esc(a.crit||"")}" placeholder="e.g. &lt;2.5 or &gt;6.5">
      ${editable.length ? editable.map(r=>{
          const ov = ridOverride(t.id, r.rid) || {};
          return `<div class="mylab-rid" data-rid="${esc(r.rid)}" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)">
            <label class="fl">${esc(r.grp)} <span class="muted">(textbook: ${rangeText(r,S.units)})</span> — lower</label>
            <input class="fi lc-lo" value="${esc(ov.lo||"")}" inputmode="decimal">
            <label class="fl">${esc(r.grp)} — upper</label>
            <input class="fi lc-hi" value="${esc(ov.hi||"")}" inputmode="decimal">
          </div>`;
        }).join("")
        : `<p class="muted" style="margin-top:8px">No locally editable rows for ${an?esc(an.label):"this test"} — see below.</p>`}
      ${locked.length ? `<p class="unitnote" style="margin-top:8px">${locked.map(r=>esc(r.grp)).join(", ")} ${locked.length===1?"is":"are"} a fixed guideline band, not a lab reference range, and can't be overridden here.</p>` : ""}
    </div>`;
  });
  html += `<label class="fl">Notes — TAT, send-out lab, sample quirks</label><textarea class="fi" id="lcNote" rows="3">${esc(localBlob(t.id).note||"")}</textarea>
    <div class="btnrow"><button class="btn" id="lcSave">Save</button><button class="btn sec" id="lcClear">Clear all</button></div>`;
  return html;
}

function renderDetail(){
  renderCrumbs();
  const t = testById(detailId); if(!t) return;
  const tube = tubeById(t.tube.id);
  const comps = componentsOf(t);
  const isFav = S.favs.includes(t.id);
  const qualitative = qualitativeTest(t);

  const badges = [];
  if(t.assayDep) badges.push('<span class="badge b-assay">Assay-dependent</span>');
  if(t.critical) badges.push('<span class="badge b-crit">Critical value</span>');
  if(/\d\s*h/i.test(t.prep.fasting)) badges.push('<span class="badge b-fast">Fasting</span>');
  if(hasLocal(t.id)) badges.push('<span class="badge b-local">Local value set</span>');

  /* Any locally-saved critical values, one per component if this is a panel */
  const localCrits = [];
  (comps||[null]).forEach(an=>{
    const ov = assayOverride(t.id, an?an.key:"_");
    if(ov && ov.crit) localCrits.push((an?esc(an.label)+": ":"")+esc(ov.crit));
  });
  const critTxt = localCrits.length
    ? localCrits.join("<br>")+' <span class="badge b-local">Local</span>'
    : (t.critical?esc(t.critical.txt):null);

  $("#v-detail").innerHTML = `
  <div class="card">
    <div class="detail-head">
      <h1>${esc(t.name)}</h1>
      ${/* a few tests have an abbr equal to their category name (Lipid Profile
            is abbr "Lipids" in category "Lipids") — printing both reads as a
            glitch, so collapse the duplicate */""}
      <div class="abbr">${[t.abbr, (catById(t.cat)||{}).name]
          .filter((v,i,a)=> v && a.indexOf(v)===i).map(esc).join(" · ")}</div>
      ${badges.length?`<div class="badges">${badges.join("")}</div>`:""}
    </div>
    <div class="card-pad" style="display:flex;gap:8px">
      <button class="btn sec" style="flex:1" id="favBtn">${isFav?"★ Saved":"☆ Save"}</button>
      <button class="btn sec" style="flex:1" id="addPick">＋ Tube Picker</button>
    </div>
  </div>

  ${t.assayDep?`<div class="alert warn"><b>Assay-dependent.</b> The cutoff for this test is specific to the analyser and method your laboratory uses. The values below are widely cited defaults — enter your own in My Lab before relying on them.</div>`:""}
  ${critTxt?`<div class="alert crit"><b>Critical value:</b> ${critTxt}</div>`:""}

  ${block("Reference ranges","rng", rangeSectionHtml(t), true)}

  ${block("Specimen & tube","tub",`
    ${tube?`<div class="tubepill"><span class="tubedot" style="background:${tubeColor(tube)}"></span>${esc(tube.name)} — ${esc(tube.colors)}</div>`:""}
    <div style="margin-top:12px">
      <div class="kv"><span class="k">Specimen</span><span class="v">${esc(t.specimen)}</span></div>
      <div class="kv"><span class="k">Volume</span><span class="v">${esc(t.tube.vol)}</span></div>
      ${tube?`<div class="kv"><span class="k">Additive</span><span class="v">${esc(tube.additive)}</span></div>
      <div class="kv"><span class="k">Inversions</span><span class="v">${esc(tube.inv)}</span></div>
      <div class="kv"><span class="k">Order of draw</span><span class="v">Position ${tube.order||"—"} (CLSI GP41)</span></div>`:""}
      <div class="kv"><span class="k">Handling</span><span class="v">${esc(t.tube.handling)}</span></div>
    </div>`)}

  ${block("Patient preparation","prp",`
    <div class="alert ${/not required/i.test(t.prep.fasting)?"info":"warn"}"><b>Fasting:</b> ${esc(t.prep.fasting)}</div>
    <div class="muted" style="font-weight:700;margin-bottom:6px">For collection staff</div>
    <ul class="lst">${t.prep.items.map(i=>"<li>"+esc(i)+"</li>").join("")}</ul>
    ${(t.prep.patient&&t.prep.patient.length)?`
      <div class="muted" style="font-weight:700;margin:14px 0 6px">To tell the patient</div>
      <ul class="lst">${t.prep.patient.map(i=>"<li>"+esc(i)+"</li>").join("")}</ul>
      <div class="unitnote">These lines, and only these, go into the printed patient handout.</div>`:
      `<div class="unitnote">Nothing specific for the patient to do before this test.</div>`}`)}

  ${block("Causes of raised value","inc",`<ul class="lst">${t.inc.map(i=>"<li>"+esc(i)+"</li>").join("")}</ul>`)}
  ${block("Causes of low value","dec",`<ul class="lst">${t.dec.map(i=>"<li>"+esc(i)+"</li>").join("")}</ul>`)}
  ${block("Interferences","itf",`<ul class="lst">${t.interf.map(i=>"<li>"+md(i)+"</li>").join("")}</ul>`)}
  ${block("Interpretation notes","prl",`<ul class="lst">${t.pearls.map(i=>"<li>"+md(i)+"</li>").join("")}</ul>`,true)}

  ${/* Collapsed even when a local value is saved: an override already shows in
       the open Reference ranges block above, carrying a "Your lab" badge, so
       nothing is hidden by keeping this editor shut until it is wanted. */""}
  ${block("Your lab's values","loc", myLabBlockHtml(t), false)}

  ${t.rel && t.rel.length ? `<h2 class="sec">Related tests</h2><div class="card">${
     t.rel.map(testById).filter(Boolean).map(testRow).join("")}</div>` : ""}
  `;

  bindBlocks($("#v-detail"));
  bindRows($("#v-detail"));
  $("#favBtn").onclick = ()=>{
    S.favs = isFav ? S.favs.filter(x=>x!==t.id) : S.favs.concat(t.id); save(); renderDetail();
  };
  $("#addPick").onclick = ()=>{
    if(!S.picker.includes(t.id)) S.picker.push(t.id);
    save(); $("#addPick").textContent = "✓ In picker";
  };
  if(S.picker.includes(t.id)) $("#addPick").textContent = "✓ In picker";
  $("#lcSave").onclick = ()=>{
    $$("#v-detail .mylab-comp").forEach(div=>{
      const key = div.dataset.key;
      saveAssay(t.id, key, {
        unit: div.querySelector(".lc-unit").value.trim(),
        method: div.querySelector(".lc-method").value.trim(),
        crit: div.querySelector(".lc-crit").value.trim()
      });
      div.querySelectorAll(".mylab-rid").forEach(ridDiv=>{
        saveRid(t.id, ridDiv.dataset.rid, {
          lo: ridDiv.querySelector(".lc-lo").value.trim(),
          hi: ridDiv.querySelector(".lc-hi").value.trim()
        });
      });
    });
    saveNote(t.id, $("#lcNote").value.trim());
    save(); renderDetail();
  };
  /* Destructive, sits one tap from Save, and throws away numbers the user
     transcribed off their own lab's report — so it asks first, the same as
     the global reset does. Clearing a test's values by mis-tap and only
     noticing later, when the Interpreter silently grades against textbook
     ranges again, is exactly the kind of quiet wrong answer this app
     cannot afford. */
  $("#lcClear").onclick = async ()=>{
    if(!hasLocal(t.id)){ delete S.local[t.id]; save(); renderDetail(); return; }
    const ok = await ask("Clear your values for " + t.name + "?",
      "Every range, unit, method, critical value and note you have saved for "
      + "this test on this device will be removed. Your other tests are not "
      + "affected.",
      { okLabel:"Clear this test", danger:true });
    if(!ok) return;
    delete S.local[t.id]; save(); renderDetail();
  };
}

function tubeColor(tb){
  if(tb.id==="bc") return "linear-gradient(135deg,#8bc98b 50%,#e8975a 50%)"; /* not CLSI colour-coded — brand-specific */
  const c = tb.colors.toLowerCase();
  if(c.includes("light blue")) return "#7fb8e8";
  if(c.includes("gold")) return "#d4a017";
  if(c.includes("lavender")||c.includes("pink")) return "#c8a2d8";
  if(c.includes("light green")) return "#90d490";
  if(c.includes("green")) return "#4a9e4a";
  if(c.includes("grey")||c.includes("gray")) return "#9aa5ad";
  if(c.includes("royal blue")) return "#2a5ca8";
  if(c.includes("black")) return "#3b3b3b";
  if(c.includes("red")) return "#d14545";
  return "#b8c2c9";
}
/* opts.flush   — body holds edge-to-edge .row buttons, so drop body padding
   opts.persist — remember this block's open/closed state across renders in
                  S.panels. Used by the Tests tab's landing panels, where a
                  collapse that sprang back open on every navigation would
                  read as a bug. Detail-page blocks deliberately do NOT
                  persist: they reset to their documented defaults each time. */
function block(title,id,inner,open,opts){
  opts = opts || {};
  return `<div class="block card ${open?"open":""}" data-blk="${id}"${opts.persist?' data-persist="1"':''}>
    <button class="bh">${esc(title)}<span class="tw">›</span></button>
    <div class="bc${opts.flush?" flush":""}">${inner}</div></div>`;
}
function bindBlocks(scope){
  scope.querySelectorAll(".block .bh").forEach(h=>{
    h.onclick = ()=>{
      const b = h.parentElement;
      b.classList.toggle("open");
      if(b.dataset.persist){ S.panels[b.dataset.blk] = b.classList.contains("open"); save(); }
    };
  });
}
/* persisted panels default to open — only an explicit false closes one */

function renderInterp(el){
  el.innerHTML = `<button class="btn sec" id="toolBack">‹ Tools</button>
  <h2 class="sec">Result Interpreter</h2>
  <div class="card card-pad">
    <p class="muted">Uses your current patient mode, and your own lab's range when one is saved.</p>
    <label class="fl">Test</label>
    <select class="fi" id="ipTest"><option value="">Select a test…</option>
      ${TESTS.filter(t=>t.units.conv!=="Qualitative"&&t.units.conv!=="Titre + pattern")
        .map(t=>`<option value="${t.id}">${esc(t.name)} (${esc(t.abbr)})</option>`).join("")}</select>
    <div id="ipComp"></div>
    <div id="ipTie"></div>
    <label class="fl">Value</label><input class="fi" id="ipVal" inputmode="decimal" placeholder="Enter the measured value">
    <button class="btn wide" id="ipGo">Interpret</button>
    <div id="ipOut"></div>
  </div>`;
  toolBack(el);
  /* A panel test (Lipid Profile, ABG, PT/INR, Troponin, Bilirubin, Calcium)
     needs the user to say WHICH component the value belongs to — comparing
     a total cholesterol result against the HDL cutoff would be silently wrong.
     Separately, some single components still have more than one row tied
     for the current patient mode (see tiedCandidates()) — e.g. ESR "male
     <50y" vs "male ≥50y" both just match sex=male, age=adult. refreshTie()
     re-checks that whenever the test or component selection changes, and
     renders a required "which group applies?" picker instead of letting
     the interpreter guess. */
  function currentKey(){
    const t = testById(el.querySelector("#ipTest").value);
    const comps = t ? componentsOf(t) : null;
    const partEl = el.querySelector("#ipPart");
    return { t, key: comps ? (partEl ? partEl.value : comps[0].key) : null };
  }
  function refreshTie(){
    const { t, key } = currentKey();
    const tieEl = el.querySelector("#ipTie");
    if(!t){ tieEl.innerHTML = ""; return; }
    const tie = tiedCandidates(t, key);
    tieEl.innerHTML = tie
      ? `<label class="fl">Which group applies?</label>
         <select class="fi" id="ipTieSel"><option value="">Select…</option>
           ${tie.map(r=>`<option value="${r.rid}">${esc(r.grp)}</option>`).join("")}</select>
         <p class="muted" style="margin-top:4px">More than one reference group matches your current patient mode (sex/age/pregnancy alone can't tell them apart) — pick the one that actually fits this result.</p>`
      : "";
  }
  el.querySelector("#ipTest").onchange = e=>{
    const t = testById(e.target.value);
    const comps = t ? componentsOf(t) : null;
    el.querySelector("#ipComp").innerHTML = comps
      ? `<label class="fl">Component</label><select class="fi" id="ipPart">
          ${comps.map(a=>`<option value="${a.key}">${esc(a.label)}</option>`).join("")}</select>` : "";
    const partEl = el.querySelector("#ipPart"); if(partEl) partEl.onchange = refreshTie;
    refreshTie();
  };
  el.querySelector("#ipGo").onclick = ()=>{
    const t = testById(el.querySelector("#ipTest").value);
    const v = num(el.querySelector("#ipVal").value);
    const out = el.querySelector("#ipOut");
    if(!t || v==null){ out.innerHTML = `<div class="alert warn">Select a test and enter a numeric value.</div>`; return; }
    const comps = componentsOf(t);
    const partEl = el.querySelector("#ipPart");
    const key = comps ? (partEl ? partEl.value : comps[0].key) : null;
    const an = comps ? comps.find(a=>a.key===key) : null;
    const tie = tiedCandidates(t, key);
    const tieSel = el.querySelector("#ipTieSel");
    const forcedRid = tieSel ? tieSel.value : null;
    if(tie && !forcedRid){ out.innerHTML = `<div class="alert warn">More than one reference group matches — select which one applies above before interpreting.</div>`; return; }
    const r = activeRange(t, key, forcedRid || undefined);
    /* A ref/method comparison (r) and a dx/cutoff/target classification
       (band) are independent and can both apply — Vitamin D has no ref row
       at all (band only), HbA1c has both (ref "Normal" AND the
       prediabetes/diabetes ladder), and a handful of tests have no numeric
       content for either (text-only results), which is the only case with
       nothing to show. */
    const band = classifyAgainstLadder(t, key, v);
    const hasRef = r && (r.lo!=null || r.hi!=null);
    if(!hasRef && !band){ out.innerHTML = `<div class="alert info">No numeric range available for this group — see the test page.</div>`; return; }

    let flag=null, word=null, causes=null;
    if(hasRef){
      flag="rf-normal"; word="Within range";
      if(r.hi!=null && v>r.hi){ flag="rf-high"; word="ABOVE range"; }
      else if(r.lo!=null && v<r.lo){ flag="rf-low"; word="BELOW range"; }
      causes = word==="ABOVE range" ? t.inc : word==="BELOW range" ? t.dec : null;
    }
    const cu = componentUnit(t, an);
    const shownUnit = S.units==="si" ? cu.si : cu.conv;
    const ov = assayOverride(t.id, key||"_");
    /* A panel's test-wide critical value may name only one of its components
       (e.g. Lipid Profile's critical figure is triglycerides-specific) --
       t.critical.analyte, when present, restricts it to those component keys
       so it never appears while interpreting a different component. */
    const testCritApplies = !t.critical || !t.critical.analyte || !key || t.critical.analyte.includes(key);
    const crit = (ov&&ov.crit) || (testCritApplies && t.critical ? t.critical.txt : null);

    const headline = hasRef
      ? `<div class="result-flag ${flag}">${v}${shownUnit?" "+esc(shownUnit):""} — ${word}${an?" ("+esc(an.label)+")":""}</div>
         <div class="kv" style="margin-top:10px"><span class="k">Compared with</span>
           <span class="v">${esc(r.grp)}${r.local?' <span class="badge b-local">Your lab</span>':''} · ${r.lo!=null?r.lo:"—"} – ${r.hi!=null?r.hi:"—"}</span></div>`
      : `<div class="result-flag rf-normal">${v}${shownUnit?" "+esc(shownUnit):""}${an?" ("+esc(an.label)+")":""}</div>`;

    let bandHtml = "";
    if(band && band.row){
      const dirTxt = band.dir==="below" ? "Below the lowest defined band — nearest: " : band.dir==="above" ? "Above the highest defined band — nearest: " : "";
      const bandLocal = overridableKind(band.row,t) && ridOverride(t.id, band.row.rid);
      bandHtml = `<div class="kv" style="margin-top:10px"><span class="k">Classification</span>
        <span class="v">${dirTxt}${esc(band.row.grp)}${bandLocal?' <span class="badge b-local">Your lab</span>':''}</span></div>`;
    } else if(band && band.needsChoice){
      bandHtml = `<div class="alert info" style="margin-top:10px">This also sits in one of several named categories, but which one depends on clinical context, not just the number — see the test page: ${band.choices.map(c=>esc(c.grp)).join(", ")}.</div>`;
    }

    out.innerHTML = `${headline}
      ${bandHtml}
      ${crit?`<div class="alert crit" style="margin-top:10px"><b>Critical value:</b> ${esc(crit)}</div>`:""}
      ${t.assayDep?`<div class="alert warn"><b>Assay-dependent</b> — confirm against your analyser's own cutoff.</div>`:""}
      ${causes&&causes.length?`<h2 class="sec">Consider</h2><ul class="lst">${causes.slice(0,8).map(c=>"<li>"+esc(c)+"</li>").join("")}</ul>`:""}
      <button class="btn sec wide" id="ipOpen">Open full test page ›</button>`;
    const ob = out.querySelector("#ipOpen"); if(ob) ob.onclick = ()=> openTest(t.id);
  };
}

function renderReverse(el){
  const findings = [];
  TESTS.forEach(t=>{
    if(t.inc.length) findings.push({label:"Raised "+t.name, test:t, dir:"inc"});
    if(t.dec.length) findings.push({label:"Low "+t.name, test:t, dir:"dec"});
  });
  findings.sort((a,b)=>a.label.localeCompare(b.label));
  el.innerHTML = `<button class="btn sec" id="toolBack">‹ Tools</button>
  <h2 class="sec">Reverse Lookup</h2>
  <div class="card card-pad">
    <p class="muted">Start from the abnormality and work back to the differential.</p>
    <label class="fl">Finding</label>
    <select class="fi" id="rvSel"><option value="">Select a finding…</option>
      ${findings.map((f,i)=>`<option value="${i}">${esc(f.label)}</option>`).join("")}</select>
    <div id="rvOut"></div>
  </div>`;
  toolBack(el);
  el.querySelector("#rvSel").onchange = e=>{
    const f = findings[e.target.value]; const out = el.querySelector("#rvOut");
    if(!f){ out.innerHTML=""; return; }
    const list = f.dir==="inc" ? f.test.inc : f.test.dec;
    out.innerHTML = `<h2 class="sec">${esc(f.label)} — causes</h2>
      <ul class="lst">${list.map(c=>"<li>"+esc(c)+"</li>").join("")}</ul>
      ${f.test.rel.length?`<h2 class="sec">Next tests to consider</h2><div class="card">${
        f.test.rel.map(testById).filter(Boolean).map(testRow).join("")}</div>`:""}`;
    bindRows(out);
  };
}

function renderHandout(el){
  const sel = S.picker.map(testById).filter(Boolean);
  const fastHrs = sel.map(t=>t.prep.fasting).filter(f=>!/not required/i.test(f));
  const lines = [];
  lines.push("INSTRUCTIONS BEFORE YOUR BLOOD TEST");
  lines.push("");
  if(S.labName) lines.push(S.labName);
  lines.push("Tests: " + (sel.length?sel.map(t=>t.name).join(", "):"—"));
  lines.push("");
  if(fastHrs.length){
    lines.push("FASTING REQUIRED");
    lines.push("Do not eat or drink anything except plain water for 8–12 hours before the test. No tea, coffee, milk, sugar or tobacco. Take plain water freely.");
    lines.push("");
  } else if(sel.length) {
    lines.push("NO FASTING REQUIRED — you may eat and drink normally.");
    lines.push("");
  }
  /* Only prep.patient reaches the handout. prep.items is written for the
     clinician and collection staff and must never be shown to the patient. */
  const allItems = [];
  sel.forEach(t=> (t.prep.patient||[]).forEach(i=>{
    /* the generic fasting block above already states the fast — drop per-test duplicates */
    if(fastHrs.length && /^fast for/i.test(i)) return;
    if(!allItems.includes(i)) allItems.push(i);
  }));
  if(allItems.length){
    lines.push("PLEASE ALSO NOTE");
    allItems.forEach(i=> lines.push("• " + i));
    lines.push("");
  }
  lines.push("GENERAL");
  lines.push("• Bring this sheet, your prescription and any previous reports.");
  lines.push("• Bring a written list of all medicines you take, including ayurvedic, herbal and over-the-counter preparations.");
  lines.push("• Do not stop any prescribed medicine unless your doctor has told you to.");
  lines.push("• Wear loose sleeves that roll up easily above the elbow.");
  lines.push("• Tell the technician if you have fainted during a blood test before.");

  el.innerHTML = `<button class="btn sec" id="toolBack">‹ Tools</button>
  <h2 class="sec">Prep Handout</h2>
  <div class="card card-pad noprint">
    <p class="muted">Generated from the tests in your Tube Picker. Print or share with the patient.</p>
    <div class="btnrow"><button class="btn" id="hoPrint">Print</button>
    <button class="btn sec" id="hoCopy">Copy text</button></div>
  </div>
  <div class="handout" id="hoText">${esc(lines.join("\n"))}</div>`;
  toolBack(el);
  el.querySelector("#hoPrint").onclick = ()=> window.print();
  el.querySelector("#hoCopy").onclick = function(){
    const txt = lines.join("\n");
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>{ this.textContent="✓ Copied"; });
    else { const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
           document.execCommand("copy"); ta.remove(); this.textContent="✓ Copied"; }
  };
}
