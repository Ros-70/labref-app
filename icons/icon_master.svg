<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#0f9488"/>
      <stop offset="100%" stop-color="#0b4a44"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="liqRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#e64a19"/>
    </linearGradient>
    <linearGradient id="liqBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="liqAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="116" ry="116" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" ry="116" fill="url(#sheen)"/>

  <!-- ===================== TEST TUBE RACK (left) ===================== -->
  <g transform="translate(70,150)">
    <!-- tube 1 -->
    <g transform="translate(0,0)">
      <rect x="6" y="0" width="54" height="150" rx="20" fill="#ffffff" fill-opacity="0.95"/>
      <path d="M10 80 L56 80 L56 128 A23 23 0 0 1 10 128 Z" fill="url(#liqAmber)"/>
      <rect x="6" y="0" width="54" height="150" rx="20" fill="none" stroke="#0b4a44" stroke-opacity="0.12" stroke-width="3"/>
    </g>
    <!-- tube 2 -->
    <g transform="translate(66,-26)">
      <rect x="6" y="0" width="54" height="176" rx="20" fill="#ffffff" fill-opacity="0.95"/>
      <path d="M10 96 L56 96 L56 154 A23 23 0 0 1 10 154 Z" fill="url(#liqBlue)"/>
      <rect x="6" y="0" width="54" height="176" rx="20" fill="none" stroke="#0b4a44" stroke-opacity="0.12" stroke-width="3"/>
    </g>
    <!-- tube 3 -->
    <g transform="translate(132,14)">
      <rect x="6" y="0" width="54" height="136" rx="20" fill="#ffffff" fill-opacity="0.95"/>
      <path d="M10 66 L56 66 L56 114 A23 23 0 0 1 10 114 Z" fill="url(#liqRed)"/>
      <rect x="6" y="0" width="54" height="136" rx="20" fill="none" stroke="#0b4a44" stroke-opacity="0.12" stroke-width="3"/>
    </g>
    <!-- rack bar -->
    <rect x="-16" y="118" width="246" height="34" rx="10" fill="#083e39"/>
    <rect x="-16" y="118" width="246" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>
    <!-- rack legs -->
    <rect x="-10" y="150" width="16" height="36" rx="4" fill="#083e39"/>
    <rect x="204" y="150" width="16" height="36" rx="4" fill="#083e39"/>
  </g>

  <!-- ===================== MICROSCOPE (right, overlapping) ===================== -->
  <g transform="translate(224,96)">
    <!-- base -->
    <rect x="30" y="300" width="190" height="30" rx="12" fill="#ffffff"/>
    <!-- foot / column -->
    <rect x="108" y="256" width="34" height="50" rx="10" fill="#ffffff"/>
    <!-- curved arm -->
    <path d="M125 256
             C 80 256, 58 214, 70 170
             C 78 140, 104 118, 140 112"
          fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <!-- stage -->
    <rect x="46" y="222" width="110" height="20" rx="10" fill="#ffffff"/>
    <circle cx="101" cy="232" r="13" fill="#0b4a44"/>
    <!-- objective lens nub -->
    <rect x="92" y="180" width="20" height="44" rx="8" fill="#ffffff"/>
    <circle cx="102" cy="180" r="12" fill="#ffffff"/>
    <!-- body tube (angled) -->
    <g transform="rotate(-34 140 112)">
      <rect x="128" y="20" width="46" height="110" rx="16" fill="#ffffff"/>
      <rect x="128" y="20" width="46" height="26" rx="13" fill="#0b4a44" fill-opacity="0.85"/>
    </g>
    <!-- eyepiece -->
    <g transform="rotate(-34 140 112)">
      <rect x="134" y="-24" width="34" height="46" rx="14" fill="#ffffff"/>
    </g>
    <!-- lens accent -->
    <circle cx="101" cy="232" r="6" fill="url(#liqBlue)"/>
  </g>
</svg>
